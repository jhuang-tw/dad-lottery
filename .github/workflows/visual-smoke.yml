name: Visual smoke test

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  smoke:
    if: github.head_ref == 'polish/readme-web-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: polish/readme-web-copy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start Streamlit
        run: |
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > streamlit-smoke.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          cat streamlit-smoke.log
          exit 1

      - name: Exercise desktop and mobile UI
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path("visual-smoke")
          out.mkdir(exist_ok=True)

          with sync_playwright() as p:
              browser = p.chromium.launch()

              desktop = browser.new_context(viewport={"width": 1440, "height": 1100}, device_scale_factor=1)
              page = desktop.new_page()
              page.goto("http://127.0.0.1:8501", wait_until="networkidle")
              page.locator(".hero").wait_for(state="visible")
              assert "爸爸的樂透實驗" in page.locator(".hero").inner_text()
              assert page.get_by_role("button", name="隨機選一組並回測").is_visible()
              page.screenshot(path=out / "desktop-home.png", full_page=True)

              page.get_by_role("button", name="隨機選一組並回測").click()
              page.get_by_text("回測結果", exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / "desktop-result.png", full_page=True)
              desktop.close()

              mobile = browser.new_context(viewport={"width": 390, "height": 844}, device_scale_factor=1)
              mobile_page = mobile.new_page()
              mobile_page.goto("http://127.0.0.1:8501", wait_until="networkidle")
              mobile_page.locator(".hero").wait_for(state="visible")
              assert mobile_page.get_by_role("button", name="隨機選一組並回測").is_visible()
              mobile_page.screenshot(path=out / "mobile-home.png", full_page=True)
              mobile.close()

              browser.close()
          PY

      - name: Upload screenshots and log
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: |
            visual-smoke/*.png
            streamlit-smoke.log
          if-no-files-found: error
