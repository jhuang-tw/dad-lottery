name: Apply one-time content polish

on:
  push:
    branches:
      - polish/readme-web-copy
    paths:
      - scripts/apply_polish.py
      - .github/workflows/apply-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply copy and visual updates
        run: python scripts/apply_polish.py

      - name: Validate Python syntax
        run: python -m compileall -q streamlit_app.py src scripts

      - name: Remove one-time migration files
        run: rm scripts/apply_polish.py .github/workflows/apply-polish.yml

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md streamlit_app.py scripts/apply_polish.py .github/workflows/apply-polish.yml
          git commit -m "style: refine Streamlit design and humanize copy"
          git push origin HEAD:polish/readme-web-copy
