name: Apply one-time content polish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'polish/readme-web-copy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: polish/readme-web-copy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Allow repeated exact copy matches
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_polish.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)'''
          new = '''    if count == 0:\n        print(f"warning: {label}: no exact match; skipped")\n        return text\n    if count > 1:\n        print(f"note: {label}: applying {count} identical exact matches")\n    return text.replace(old, new)'''
          if old not in text:
              raise SystemExit("replace_exact guard was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply copy and visual updates
        run: python scripts/apply_polish.py

      - name: Validate Python syntax
        run: python -m compileall -q streamlit_app.py src scripts

      - name: Remove one-time migration files
        run: rm scripts/apply_polish.py .github/workflows/apply-polish.yml polish-diagnostic.txt

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md streamlit_app.py scripts/apply_polish.py .github/workflows/apply-polish.yml polish-diagnostic.txt
          git commit -m "style: refine Streamlit design and humanize copy"
          git push origin HEAD:polish/readme-web-copy
