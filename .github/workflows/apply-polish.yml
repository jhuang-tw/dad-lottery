name: Diagnose one-time content polish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'polish/readme-web-copy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: polish/readme-web-copy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture complete migration output
        run: |
          if [ -f polish-diagnostic.txt ]; then
            echo "Diagnostic already exists; nothing to do."
            exit 0
          fi
          set +e
          python scripts/apply_polish.py > polish-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> polish-diagnostic.txt
          set -e

      - name: Commit diagnostic
        run: |
          if [ ! -f polish-diagnostic.txt ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polish-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture polish migration diagnostic"
          git push origin HEAD:polish/readme-web-copy
