name: Final copy cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'polish/readme-web-copy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: polish/readme-web-copy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final text and font-weight fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("streamlit_app.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('st.caption(f"目前有 {game.name} 共 {len(draws):,} 期開獎紀錄。")', 'st.caption(f"目前收錄 {game.name} {len(draws):,} 期開獎紀錄。")'),
              ('font-size: clamp(2.15rem, 7vw, 3.5rem);\n            font-weight: 800;', 'font-size: clamp(2.15rem, 7vw, 3.5rem);\n            font-weight: 700;'),
              ('font-size: 1.32rem;\n            font-weight: 800;', 'font-size: 1.32rem;\n            font-weight: 700;'),
              ('font-size: 1.35rem;\n            font-weight: 800;\n            line-height: 1.35;', 'font-size: 1.35rem;\n            font-weight: 700;\n            line-height: 1.35;'),
              ('div[data-testid="stRadio"] label { font-size: 1rem !important; font-weight: 650 !important; }', 'div[data-testid="stRadio"] label { font-size: 1rem !important; font-weight: 600 !important; }'),
              ('direction = "和隨機差不多" if abs(diff) < 0.05 else ("比隨機高一點" if diff > 0 else "比隨機低一點")', 'comparison = "兩個數字很接近" if abs(diff) < 0.05 else ("這組號碼高一點" if diff > 0 else "這組號碼低一點")'),
              ('兩者{direction}。<br/><u>從這段歷史紀錄，看不出它有能重複出現的優勢。</u>', '{comparison}。<br/><u>從這段歷史紀錄，看不出它有能重複出現的優勢。</u>'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary and smoke files
        run: |
          rm -rf refine-smoke streamlit-refine.log
          rm -f finalize-trigger.txt typography-refine-error.log
          rm -f .github/workflows/finalize-ui-refinement.yml

      - name: Validate syntax
        run: python -m compileall -q streamlit_app.py src scripts

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/refine-copy-typography.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: finish Chinese typography and copy cleanup"
          git push origin HEAD:polish/readme-web-copy
