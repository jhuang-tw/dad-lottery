name: Diagnose typography refinement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'polish/readme-web-copy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: polish/readme-web-copy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture complete script output
        run: |
          set +e
          python scripts/refine_copy_typography.py > typography-refine-error.log 2>&1
          echo "exit_status=$?" >> typography-refine-error.log
          set -e

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typography-refine-error.log
          git commit -m "chore: capture typography refinement diagnostic"
          git push origin HEAD:polish/readme-web-copy
